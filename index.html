<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주소 찾기</title>
<style>
:root{--bg:#f6f1ec;--card:#fff;--fg:#2a211c;--mut:#7b6c62;--line:#e5dad0;--ac:#c8501a;--ok:#1f8a4c;--okb:#e3f5ea}
@media (prefers-color-scheme:dark){:root{--bg:#1d1814;--card:#2a231e;--fg:#f3ebe4;--mut:#b2a398;--line:#443a32;--ac:#ff8a4d;--ok:#58d08a;--okb:#1f3a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Noto Sans KR",sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:12px}
h1{font-size:18px;margin:0}
#box{height:460px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
#res{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;gap:10px}
#res.on{display:grid}
.k{font-size:12px;color:var(--mut)}
#road{font-size:17px;font-weight:700;word-break:keep-all}
input{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:13px;cursor:pointer;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--fg);border:1.5px solid var(--line);font-weight:600}
#ok{display:none;background:var(--okb);color:var(--ok);padding:9px 12px;border-radius:10px;font-weight:700}
#ok.on{display:block}
#full{width:100%;height:1px;opacity:0;position:absolute;pointer-events:none}
</style>
</head>
<body>
<div class="w">
 <h1>주소 찾기</h1>
 <div id="box"></div>
 <div id="res">
  <div><div class="k">선택한 주소</div><div id="road"></div><div class="k" id="jibun"></div></div>
  <input id="detail" placeholder="상세주소 (동/호수, 선택)" autocomplete="off">
  <button id="copy" type="button">이 주소 복사하기</button>
  <div id="ok" role="status"></div>
  <button class="g" id="again" type="button">다시 검색</button>
 </div>
</div>
<textarea id="full" aria-hidden="true" tabindex="-1"></textarea>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
var $=function(s){return document.querySelector(s)},base='';
var q=new URLSearchParams(location.search).get('q')||'';
function start(){
 $('#res').classList.remove('on');$('#box').style.display='';$('#ok').classList.remove('on');
 new kakao.Postcode({
  width:'100%',height:'100%',
  oncomplete:function(d){
   var extra='';
   if(d.bname&&/[동로가]$/.test(d.bname))extra+=d.bname;
   if(d.buildingName&&d.apartment==='Y')extra+=(extra?', ':'')+d.buildingName;
   base=(d.roadAddress||d.jibunAddress)+(extra?' ('+extra+')':'');
   $('#road').textContent=base;$('#jibun').textContent=d.jibunAddress?'지번 '+d.jibunAddress:'';
   $('#box').style.display='none';$('#res').classList.add('on');$('#detail').focus();
  }
 }).embed($('#box'),q?{q:q}:undefined);
}
function full(){return (base+' '+$('#detail').value.trim()).trim()}
$('#copy').onclick=function(){
 var t=full(),done=function(){var o=$('#ok');o.textContent='복사했습니다 · '+t;o.classList.add('on')};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
 function fb(){var a=$('#full');a.value=t;a.style.height='auto';a.select();try{document.execCommand('copy');done()}catch(e){$('#ok').textContent='길게 눌러 복사하세요: '+t;$('#ok').classList.add('on')}}
};
$('#again').onclick=start;
if(window.kakao&&kakao.Postcode)start();else $('#box').textContent='주소 검색을 불러오지 못했습니다. 인터넷 연결을 확인하세요.';
</script>
</body>
</html>
